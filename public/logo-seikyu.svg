<svg
  viewBox="0 0 54 40"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Tarjeta de crédito -->
  <rect
    x="2"
    y="6"
    width="40"
    height="26"
    rx="4"
    fill="#10b981"
    opacity="0.18"
  />

  <!-- Banda magnética -->
  <rect
    x="2"
    y="11"
    width="40"
    height="4"
    fill="#10b981"
    opacity="0.45"
  />

  <!-- Chip -->
  <rect
    x="6"
    y="18"
    width="8"
    height="6"
    rx="1.2"
    fill="#10b981"
    opacity="0.65"
  />

  <!-- Moneda frontal -->
  <circle
    cx="38"
    cy="22"
    r="10"
    fill="#10b981"
  />

  <!-- Borde interno moneda -->
  <circle
    cx="38"
    cy="22"
    r="7"
    fill="none"
    stroke="white"
    stroke-width="1.5"
    opacity="0.9"
  />

  <!-- Símbolo de dinero -->
  <path
    d="M38 17V27M35.5 19.5H40.5M35.5 24.5H40.5"
    stroke="white"
    stroke-width="1.5"
    stroke-linecap="round"
  />
